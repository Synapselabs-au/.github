name: Underbark PR Gate

permissions: {}

on:
  pull_request:

concurrency:
  group: underbark-pr-gate-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify trusted verification
    if: ${{ github.repository == 'Synapselabs-au/Underbark' }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      classification: ${{ steps.classify.outputs.classification }}
      backend_functions: ${{ steps.classify.outputs.backend_functions }}
      backend_database: ${{ steps.classify.outputs.backend_database }}
    steps:
      - name: Check out trusted gate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Synapselabs-au/.github
          ref: ${{ github.workflow_sha }}
          path: .gate
          persist-credentials: false

      - name: Check out candidate without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: .candidate
          persist-credentials: false

      # Two mechanical checks over the candidate's governance documents --
      # a revalidation filed under the wrong claim, and the canonical
      # defect-family count restated outside its single home. Five review
      # rounds of reading kept finding exactly these two, so they are
      # scripted; this runs the CANDIDATE's copy, so the check evolves with
      # the branch under review. Fail-open when the script is absent, so
      # branches cut before 2026-08-29 stay green -- a documented judgement,
      # proportionate because this is a docs-consistency check, not an
      # erasure guard.
      - name: Governance claims register
        run: |
          if [ -f .candidate/scripts/verify-claims-register.sh ]; then
            bash .candidate/scripts/verify-claims-register.sh
          else
            echo "verify-claims-register.sh absent: head predates ecec8574; no check to run"
          fi

      - name: Classify exact event diff
        id: classify
        env:
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          require_same_pr() {
            read -r live_head live_base_ref live_state < <(gh api \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '[.head.sha, .base.ref, .state] | @tsv')
            if [[ "$live_head" != "$EVENT_HEAD" \
              || "$live_base_ref" != "$EVENT_BASE_REF" \
              || "$live_state" != "open" ]]; then
              echo "Refusing changed, closed, or wrong-base pull request state." >&2
              exit 1
            fi
          }

          require_same_pr
          if [[ "$EVENT_BASE_REF" != "dev" ]]; then
            echo "Underbark feature pull requests must target dev." >&2
            exit 1
          fi

          git -C .candidate cat-file -e "${EVENT_BASE_SHA}^{commit}"
          git -C .candidate cat-file -e "${EVENT_HEAD}^{commit}"
          git -C .candidate diff --check "$EVENT_BASE_SHA...$EVENT_HEAD"
          python3 .gate/scripts/verify-agent-context-approval.py \
            --repository "$GITHUB_REPOSITORY" \
            --repo-dir .candidate \
            --base-sha "$EVENT_BASE_SHA" \
            --head-sha "$EVENT_HEAD"
          python3 .gate/scripts/verify-underbark-supabase-config.py \
            .candidate/supabase/config.toml

          if git -C .candidate diff --quiet "$EVENT_BASE_SHA...$EVENT_HEAD"; then
            classification="static"
            backend_functions=0
            backend_database=0
          else
            classification_record="$(
              git -C .candidate diff --name-status --no-renames -z \
                "$EVENT_BASE_SHA...$EVENT_HEAD" \
                | .gate/scripts/classify-underbark-pr.sh
            )"
            IFS=$'\t' read -r classification backend_functions backend_database \
              <<<"$classification_record"

            case "$classification" in
              static|backend|apple|apple-backend|blocked) ;;
              *)
                echo "Unexpected verification classification: ${classification}." >&2
                exit 1
                ;;
            esac
            case "$backend_functions:$backend_database" in
              0:0|0:1|1:0|1:1) ;;
              *)
                echo "Invalid backend verification flags." >&2
                exit 1
                ;;
            esac
            if [[ "$classification_record" != "$classification"$'\t'"$backend_functions"$'\t'"$backend_database" ]]; then
              echo "Invalid trusted classifier output." >&2
              exit 1
            fi
            if [[ "$classification" == "blocked" ]]; then
              echo "The diff contains an unclassified path. Update the trusted gate before merge." >&2
              exit 1
            fi
          fi

          {
            echo "classification=$classification"
            echo "backend_functions=$backend_functions"
            echo "backend_database=$backend_database"
          } >>"$GITHUB_OUTPUT"

          require_same_pr
          echo "Trusted verification classification: $classification."
          if [[ "$classification" == "apple" || "$classification" == "apple-backend" ]]; then
            echo "Apple runtime verification is release-scoped."
          fi

  website_context:
    name: Verify website agent context
    if: ${{ github.repository == 'Synapselabs-au/Underbark-Web' }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted gate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Synapselabs-au/.github
          ref: ${{ github.workflow_sha }}
          path: .gate
          persist-credentials: false

      - name: Check out candidate without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: .candidate
          persist-credentials: false

      - name: Verify exact website agent context
        env:
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          require_same_pr() {
            read -r live_head live_base_ref live_state < <(gh api \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '[.head.sha, .base.ref, .state] | @tsv')
            if [[ "$live_head" != "$EVENT_HEAD" \
              || "$live_base_ref" != "$EVENT_BASE_REF" \
              || "$live_state" != "open" ]]; then
              echo "Refusing changed, closed, or wrong-base pull request state." >&2
              exit 1
            fi
          }

          require_same_pr
          if [[ "$EVENT_BASE_REF" != "dev" ]]; then
            echo "Underbark website pull requests must target dev." >&2
            exit 1
          fi

          git -C .candidate cat-file -e "${EVENT_BASE_SHA}^{commit}"
          git -C .candidate cat-file -e "${EVENT_HEAD}^{commit}"
          git -C .candidate diff --check "$EVENT_BASE_SHA...$EVENT_HEAD"
          python3 .gate/scripts/verify-agent-context-approval.py \
            --repository "$GITHUB_REPOSITORY" \
            --repo-dir .candidate \
            --base-sha "$EVENT_BASE_SHA" \
            --head-sha "$EVENT_HEAD"

          require_same_pr
          echo "Website pull request head and trusted agent context verified."

  functions:
    name: Verify backend functions
    needs: classify
    if: ${{ needs.classify.result == 'success' && needs.classify.outputs.backend_functions == '1' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out candidate without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: .candidate
          persist-credentials: false

      - name: Verify isolated Supabase functions
        working-directory: .candidate
        run: |
          set -euo pipefail

          container="underbark-deno-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image="denoland/deno:2.9.5@sha256:b429777c3dcff34a6488f365a1537db1640b2d48379b60f5e6206be034472463"
          cleanup() {
            original_status="$?"
            trap - EXIT
            cleanup_status=0
            timeout 2m docker rm -f "$container" >/dev/null 2>&1 || cleanup_status="$?"
            if [[ "$original_status" -ne 0 ]]; then
              exit "$original_status"
            fi
            exit "$cleanup_status"
          }
          trap cleanup EXIT

          timeout 5m docker pull "$image"
          timeout 1m docker create \
            --pull never \
            --name "$container" \
            --network bridge \
            --workdir /workspace \
            "$image" \
            eval 'setInterval(() => {}, 3600000)'
          timeout 1m docker start "$container" >/dev/null
          timeout 1m docker cp supabase/. "$container:/workspace/supabase"
          timeout 10m docker exec "$container" sh -euc '
            if find supabase/functions -type l -print -quit | grep -q .; then
              echo "Symlinks are not allowed under supabase/functions." >&2
              exit 1
            fi
            find supabase/functions -type f -name "*.ts" -print0 | LC_ALL=C sort -z > /tmp/underbark-typescript-files
            test -s /tmp/underbark-typescript-files
            xargs -0 deno fmt --check < /tmp/underbark-typescript-files
            xargs -0 deno check --frozen --config supabase/functions/deno.json < /tmp/underbark-typescript-files
            find supabase/functions -type f \( -name "*_test.ts" -o -name "*.test.ts" \) -print0 | LC_ALL=C sort -z > /tmp/underbark-deno-test-files
            test -s /tmp/underbark-deno-test-files
            xargs -0 deno test --frozen --config supabase/functions/deno.json < /tmp/underbark-deno-test-files
          '

  database:
    name: Verify backend database
    needs: classify
    if: ${{ needs.classify.result == 'success' && needs.classify.outputs.backend_database == '1' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out candidate without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: .candidate
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.113.0

      - name: Verify disposable Supabase database
        working-directory: .candidate
        run: |
          set -euo pipefail

          cleanup() {
            original_status="$?"
            trap - EXIT
            cleanup_status=0
            timeout 5m supabase stop --workdir . --no-backup || cleanup_status="$?"
            if [[ "$original_status" -ne 0 ]]; then
              exit "$original_status"
            fi
            exit "$cleanup_status"
          }
          trap cleanup EXIT

          expected_postgres_digest="ghcr.io/supabase/postgres@sha256:99b1729aeb0bac314445024fc149fbd39306170b61dd50800ccf180327ab3459"
          expected_postgres_tag="ghcr.io/supabase/postgres:17.6.1.158"
          timeout 10m docker pull "$expected_postgres_digest"
          preflight_image_id="$(timeout 1m docker image inspect "$expected_postgres_digest" --format '{{.Id}}')"
          timeout 1m docker tag "$preflight_image_id" "$expected_postgres_tag"
          tagged_image_id="$(timeout 1m docker image inspect "$expected_postgres_tag" --format '{{.Id}}')"
          if [[ "$tagged_image_id" != "$preflight_image_id" ]]; then
            echo "The Supabase CLI Postgres tag does not resolve to the trusted image." >&2
            exit 1
          fi
          timeout 15m supabase db start --workdir .
          running_image_id="$(timeout 1m docker inspect --format '{{.Image}}' supabase_db_underbark)"
          mapfile -t running_repo_digests < <(timeout 1m docker image inspect "$running_image_id" --format '{{range .RepoDigests}}{{println .}}{{end}}' | LC_ALL=C sort -u)
          digest_match=0
          for repo_digest in "${running_repo_digests[@]}"; do
            if [[ "$repo_digest" == "$expected_postgres_digest" ]]; then
              digest_match=1
            fi
          done
          if [[ "$running_image_id" != "$preflight_image_id" || "$digest_match" -ne 1 ]]; then
            echo "The disposable Postgres image does not match the trusted digest." >&2
            exit 1
          fi
          timeout 1m docker exec supabase_db_underbark mkdir -p /tmp/underbark-tests
          timeout 1m docker cp supabase/tests/. supabase_db_underbark:/tmp/underbark-tests
          timeout 10m docker exec supabase_db_underbark bash -euo pipefail -c '
            if find /tmp/underbark-tests -type l -print -quit | grep -q .; then
              echo "Symlinks are not allowed under supabase/tests." >&2
              exit 1
            fi
            find /tmp/underbark-tests -type f -name "*.sql" -print0 | LC_ALL=C sort -z > /tmp/underbark-sql-files
            test -s /tmp/underbark-sql-files
            while IFS= read -r -d "" suite; do
              psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 -f "$suite"
            done < /tmp/underbark-sql-files
          '

  result:
    name: Underbark PR Gate result
    if: ${{ always() && github.repository == 'Synapselabs-au/Underbark' }}
    needs: [classify, functions, database]
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate final live result
        env:
          BACKEND_DATABASE: ${{ needs.classify.outputs.backend_database }}
          BACKEND_FUNCTIONS: ${{ needs.classify.outputs.backend_functions }}
          CLASSIFICATION: ${{ needs.classify.outputs.classification }}
          DATABASE_RESULT: ${{ needs.database.result }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          FUNCTIONS_RESULT: ${{ needs.functions.result }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
        run: |
          set -euo pipefail

          require_lane_result() {
            selected="$1"
            actual="$2"
            lane="$3"
            if [[ "$selected" == "1" && "$actual" != "success" ]]; then
              echo "Selected ${lane} verification did not succeed: ${actual}." >&2
              exit 1
            fi
            if [[ "$selected" == "0" && "$actual" != "skipped" ]]; then
              echo "Unselected ${lane} verification was not skipped: ${actual}." >&2
              exit 1
            fi
          }

          if [[ "$CLASSIFY_RESULT" != "success" ]]; then
            echo "Trusted classification did not succeed: ${CLASSIFY_RESULT}." >&2
            exit 1
          fi
          case "$CLASSIFICATION:$BACKEND_FUNCTIONS:$BACKEND_DATABASE" in
            static:0:0|backend:1:0|backend:0:1|backend:1:1|apple:0:0|apple-backend:1:0|apple-backend:0:1|apple-backend:1:1) ;;
            *)
              echo "Invalid terminal classifier outputs." >&2
              exit 1
              ;;
          esac

          require_lane_result "$BACKEND_FUNCTIONS" "$FUNCTIONS_RESULT" "function"
          require_lane_result "$BACKEND_DATABASE" "$DATABASE_RESULT" "database"

          read -r final_head final_base_ref final_state < <(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '[.head.sha, .base.ref, .state] | @tsv')
          if [[ "$final_head" != "$EVENT_HEAD" \
            || "$final_base_ref" != "$EVENT_BASE_REF" \
            || "$final_state" != "open" ]]; then
            echo "Refusing changed, closed, or wrong-base pull request state." >&2
            exit 1
          fi

          echo "Final pull request head and selected trusted checks verified."
          echo "Apple runtime verification is release-scoped."
